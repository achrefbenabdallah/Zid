# Netlify build & deploy config for Zid.
# Env vars (VITE_FIREBASE_* and GEMINI_API_KEY) are set in the Netlify UI — see README "Deploy to Netlify".

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # The Firebase web config is public by design (it ships in the JS bundle; Firestore rules
  # protect the data), so Netlify's secret scanner must not fail the build over it.
  # GEMINI_API_KEY is NOT listed: it is only used by the function and never reaches the bundle.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Single-page app: every route serves index.html (functions keep their own paths).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and manifest must never be cached, or updates stall.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Hashed build output is safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/exercises/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Camera for meal photos + barcode scanning; nothing else.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    # Allows the Google sign-in popup to report back to the app.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
